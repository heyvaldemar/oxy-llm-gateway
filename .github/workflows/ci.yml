name: CI

# Every change to main and every pull request: the engine's offline tests and
# documentation checks, the UI's type check, lint, unit tests and production
# build, the whole stack brought up from a clean checkout with
# `docker compose up` and driven end to end by scripts/stack_smoke.sh, and the
# proofs (proofs/run_proofs.py) measured against a recording fake provider, each
# also shown the bug it exists to catch (proofs/plant_violations.py).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily, so the proofs hold on fresh images and dependencies too, and the
  # status branch (.github/workflows/status.yml) counts green days.
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/engine/requirements*.txt

      - name: Install dependencies
        run: pip install -r packages/engine/requirements-dev.txt

      - name: Offline tests
        run: sh scripts/test_core.sh

      - name: The scripts' connection-string parser
        run: bash scripts/test_db_url_env.sh

      - name: Known vulnerabilities in pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r packages/engine/requirements.txt

      - name: Feature matrix and wording checks
        run: |
          python scripts/validate_feature_matrix.py
          python scripts/lint_sla_language.py

  ui:
    name: UI type check, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Known high or critical vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:8080
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  stack:
    name: docker compose up, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No secret on a command line, in any compose stack (shown the 1.0.3 forms first)
        run: |
          python3 scripts/argv_secrets.py selftest
          python3 scripts/argv_secrets.py static

      - name: Start the stack exactly as the README says
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test
        run: bash scripts/stack_smoke.sh

      - name: No secret on a command line while the stack runs
        run: python3 scripts/argv_secrets.py runtime

      - name: The vault key reaches Postgres without a command line, on the first boot and on a restart
        run: |
          vault_key_ok() {
            docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -v ON_ERROR_STOP=1' <<'SQL'
          \getenv k SUPABASE_VAULT_KEY
          SELECT current_setting('app.vault_key', true) = :'k';
          SQL
          }
          [ "$(vault_key_ok)" = t ] || { echo "FAIL: app.vault_key is not the configured key after the first boot"; exit 1; }
          docker compose restart postgres
          docker compose up -d --wait --wait-timeout 120 postgres
          [ "$(vault_key_ok)" = t ] || { echo "FAIL: app.vault_key is not the configured key after a restart"; exit 1; }
          lines="$(docker compose exec -T postgres sh -c 'grep -c "^app.vault_key" "$PGDATA/postgresql.auto.conf"')"
          [ "$lines" = 1 ] || { echo "FAIL: postgresql.auto.conf holds $lines app.vault_key lines"; exit 1; }
          echo "app.vault_key is the configured key after the first boot and after a restart, set once in postgresql.auto.conf"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  proofs:
    name: Proofs, each shown its planted violation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack with the recording fake provider
        run: docker compose -f docker-compose.yml -f proofs/docker-compose.proofs.yml up -d --build --wait --wait-timeout 600

      - name: Budget, DLP, kill switch, tenancy, revocation, fail closed, surface, keys at rest, audit
        run: python3 proofs/run_proofs.py

      - name: Each proof, shown its planted violation
        run: python3 proofs/plant_violations.py

      - name: Summary
        if: always()
        run: python3 proofs/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofs
          path: |
            proofs/results.json
            proofs/plants.json
            proofs/plant-*.json
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f proofs/docker-compose.proofs.yml logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f proofs/docker-compose.proofs.yml down -v

  devcontainer:
    name: Codespace devcontainer, smoke and the README's requests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (for the devcontainer CLI)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The same .devcontainer/devcontainer.json a codespace starts from:
      # docker-in-docker, then .devcontainer/start.sh (the stack with the fake
      # provider, a fresh demo key). No codespace is created.
      - name: Build and start the devcontainer
        run: npx --yes @devcontainers/cli@0.90.0 up --workspace-folder .

      - name: Smoke test and the README's three requests, inside it
        run: npx --yes @devcontainers/cli@0.90.0 exec --workspace-folder . bash .devcontainer/check.sh

      - name: Logs on failure
        if: failure()
        run: >
          npx --yes @devcontainers/cli@0.90.0 exec --workspace-folder . bash -c
          'tail -40 /tmp/dockerd.log 2>/dev/null; [ -f ~/.oxy-demo.env ] && . ~/.oxy-demo.env;
          COMPOSE_FILE=docker-compose.yml:proofs/docker-compose.proofs.yml:.devcontainer/compose.codespaces.yml
          docker compose logs --no-color --tail 150'
